name: qa-screenshots
on:
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i playwright@1.49.1 --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          npx --yes http-server@14 . -p 8080 --silent &
          sleep 4
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/index.html
      - name: Capture screenshots
        run: node scripts/shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 2
